# ==============================================================================
# Common configuration shared across all profiles (dev, staging, prod).
# Profile-specific overrides live in application-{profile}.yml.
# ==============================================================================

spring:
  application:
    name: event-registration-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ----------------------------------------------------------------------------
  # Threading — virtual threads for high-concurrency I/O (Spring Boot 3.2+)
  # ----------------------------------------------------------------------------
  threads:
    virtual:
      enabled: true

  # ----------------------------------------------------------------------------
  # JPA / Hibernate — performance-oriented defaults
  # ----------------------------------------------------------------------------
  jpa:
    open-in-view: false   # Avoid OSIV anti-pattern; transactions stay in service layer
    properties:
      hibernate:
        jdbc.batch_size: 25         # Batch multiple inserts/updates
        order_inserts: true
        order_updates: true
        batch_versioned_data: true  # Avoid pre-update SELECT for versioned entities
        query.in_clause_parameter_padding: true  # Reduces SQL plan cache churn

  # ----------------------------------------------------------------------------
  # JSON serialization
  # ----------------------------------------------------------------------------
  jackson:
    default-property-inclusion: non_null     # Omit null fields from responses
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false       # ISO-8601 dates

  # ----------------------------------------------------------------------------
  # HikariCP — common pool sizing. Profiles may override pool size.
  # ----------------------------------------------------------------------------
  datasource:
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000          # 30s
      max-lifetime: 1800000        # 30min
      connection-timeout: 20000    # 20s
      leak-detection-threshold: 30000

# ==============================================================================
# JWT — keys are supplied per profile (ephemeral in dev, RSA from secrets in prod)
# ==============================================================================
jwt:
  issuer: ${JWT_ISSUER:event-registration-api}
  audience: ${JWT_AUDIENCE:eventslk-clients}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
  clock-skew: ${JWT_CLOCK_SKEW:30s}
  rsa:
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}

# ==============================================================================
# CORS — overridden per profile. Never "*" in production.
# ==============================================================================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ==============================================================================
# Server
# ==============================================================================
server:
  port: ${SERVER_PORT:8081}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 2048
  shutdown: graceful

# ==============================================================================
# Service discovery
# ==============================================================================
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://discovery:changeit@localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    metadata-map:
      env: ${SERVICE_ENV:dev}
      version: ${SERVICE_VERSION:local}
      zone: ${INSTANCE_ZONE:local}
      team: ${SERVICE_TEAM:platform}
      commit: ${GIT_COMMIT:unknown}

# ==============================================================================
# Observability — Actuator + Prometheus
# ==============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never        # Override to "always" in dev only
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

# ==============================================================================
# Application-specific
# ==============================================================================
app:
  base-url: ${APP_BASE_URL:http://localhost:8081}
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}